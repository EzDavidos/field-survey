// ─── HELPERS ─────────────────────────────────────────────────
const mkKey    = (m,s,sz) => `${m}|${s}|${sz}`;
const nowTime  = () => new Date().toTimeString().slice(0,5);
const todayStr = () => new Date().toISOString().split("T")[0];
const tArea    = t => t.area || 250;        // backward-compat для старих записів
const tStart   = t => t.timeStart || t.time || "";
const tEnd     = t => t.timeEnd   || t.time || "";

const matStats = (tallies, mats) =>
  mats.map(m=>({...m,
    count: Object.entries(tallies)
      .filter(([k])=>k.startsWith(m.id+"|"))
      .reduce((a,[,v])=>a+v,0)
  })).filter(m=>m.count>0).sort((a,b)=>b.count-a.count);

const STORAGE_KEY = "nhatrang_field_v2";

// Groups consecutive items ONLY if same mat+src+siz AND same comment.
// Different comment = different debris type → separate group.
const groupItems = (items) => {
  const groups = [];
  for (const item of items) {
    const key = mkKey(item.mat, item.src, item.siz);
    const cmt = (item.comment || "").trim();
    const last = groups[groups.length - 1];
    if (last && last.key === key && last.comment === cmt) {
      last.count++;
      last.items.push(item);
    } else {
      groups.push({
        key, count:1, items:[item],
        mat:item.mat, src:item.src, siz:item.siz,
        comment: cmt,
        firstN: item.n,
      });
    }
  }
  return groups;
};

  const [loaded,   setLoaded]   = useState(false);
  const [tab,      setTab]      = useState("zones");
  const [zoneId,   setZoneId]   = useState(null);
  const [tId,      setTId]      = useState(null);
  const [detailTab,setDetailTab]= useState("tally");
  const [expanded, setExpanded] = useState({});
  const [toast,    setToast]    = useState(null);

  // Theme
  const [theme, setTheme] = useState(()=> localStorage.getItem("fs_theme")||"dark");
  const C = theme==="dark" ? DARK : LIGHT;
  const G = makeCSS(C);
  const toggleTheme = () => {
    const next = theme==="dark"?"light":"dark";
    setTheme(next);
    localStorage.setItem("fs_theme", next);
  };

  // Multi-day aggregate
  

  const [date,      setDate]      = useState(todayStr());
  const [weather,   setWeather]   = useState(null);
  const [transects, setTransects] = useState([]);

  const [mat, setMat] = useState(null);
  const [src, setSrc] = useState(null);
  const [siz, setSiz] = useState(null);
  const [comment, setComment] = useState("");
  const [newLen, setNewLen] = useState(50);
  const [newWid, setNewWid] = useState(5);
  const [customMaterials, setCustomMaterials] = useState([]);
  const [newMat, setNewMat] = useState("");
  const commentRef = useRef("");
  const [remembered, setRemembered] = useState({mat:null,src:null,siz:null});

  const [confirmDialog, setConfirmDialog] = useState(null);

  const [saveStatus, setSaveStatus] = useState(""); // "" | "saving" | "saved" | "error"

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null),1800); };
  const askConfirm = (msg, onOk) => setConfirmDialog({msg, onOk});

  const remMat = remembered.mat !== null;
  const remSrc = remembered.src !== null;
  const remSiz = remembered.siz !== null;

  const [dbLog, setDbLog] = useState([]);
  const addLog = (msg) => setDbLog(prev => [...prev.slice(-8), new Date().toLocaleTimeString() + " " + msg]);

  // ── STORAGE: per-day Firestore docs ──
  // Structure: DB/day_YYYY-MM-DD → {date, weather, transects}
  //            DB/settings       → {remembered}

  // Helper: load a specific day from Firestore
  const loadDay = async (dt) => {
    try {
      const snap = await window.DB.doc("day_" + dt).get();
      if (snap.exists) {
        const d = snap.data();
        return { weather: d.weather||null, transects: d.transects||[] };
      }
    } catch(e) {
      addLog("❌ Load day_" + dt + ": " + (e.code||e.message||""));
    }
    return { weather: null, transects: [] };
  };

  // Save current day data to Firestore
  const saveDay = async (dt, wx, ts) => {
    setSaveStatus("saving");
    try {
      await window.DB.doc("day_" + dt).set({ date:dt, weather:wx, transects:ts, updatedAt: new Date().toISOString() });
      setSaveStatus("saved");
    } catch(e) {
      setSaveStatus("local");
      addLog("⚠ Save fail: " + (e.code||e.message||""));
    }
  };

  // Save settings (remembered selections)
  const saveSettings = async (rem, custom) => {
    try { await window.DB.doc("settings").set({ remembered:rem, customMaterials:custom||[] }); } catch(e) {}
  };

  // Failsafe: if init hangs (e.g. Firebase timeout), force load after 8s
  useEffect(() => {
    const timer = setTimeout(() => {
      if (!loaded) { setLoaded(true); addLog("⚠ Timeout — forced load"); }
    }, 8000);
    return () => clearTimeout(timer);
  }, [loaded]);

  // Init: load settings + today's data (+ migrate old format)
  useEffect(()=>{
    (async()=>{
      try {
        addLog("⏳ Завантаження...");
        const today = todayStr();

        // Load settings
        try {
          const setSnap = await window.DB.doc("settings").get();
          if (setSnap.exists) {
            const s = setSnap.data();
            if (s.remembered) {
              setRemembered(s.remembered);
              if (s.remembered.mat) setMat(s.remembered.mat);
              if (s.remembered.src) setSrc(s.remembered.src);
              if (s.remembered.siz) setSiz(s.remembered.siz);
            }
            if (Array.isArray(s.customMaterials)) setCustomMaterials(s.customMaterials);
          }
        } catch(e) { addLog("⚠ Settings: " + (e.code||String(e))); }

        // Migrate: check old "current_day" doc
        try {
          const oldSnap = await window.DB.doc("current_day").get();
          if (oldSnap.exists) {
            const old = oldSnap.data();
            if (old.transects && old.transects.length > 0 && old.date) {
              await window.DB.doc("day_" + old.date).set({
                date: old.date, weather: old.weather, transects: old.transects,
                updatedAt: new Date().toISOString()
              });
              addLog("🔄 Міграція: " + old.date);
              await window.DB.doc("current_day").delete();
            }
          }
        } catch(e) { addLog("⚠ Migration: " + String(e)); }

        // Load today's data
        setDate(today);
        try {
          const dayData = await loadDay(today);
          setWeather(dayData.weather);
          setTransects(dayData.transects);
          if (dayData.transects.length > 0) {
            setSaveStatus("saved");
            addLog("✅ " + today + " (" + dayData.transects.length + " тр.)");
          } else {
            addLog("📄 " + today + " — порожній");
          }
        } catch(e) { addLog("❌ Load: " + String(e)); }

      } catch(e) {
        addLog("💥 Init error: " + String(e));
      } finally {
        setLoaded(true);
      }
    })();
  },[]);

  // Load aggregate stats (all days)
  const [aggStats, setAggStats] = useState(null); // {totalItems, totalTransects, totalPlastic, days}
  const loadAggregate = useCallback(async () => {
    try {
      const snap = await window.DB.get();
      let totalItems = 0, totalTransects = 0, totalPlastic = 0, dayCount = 0;
      const tallies = {};
      snap.forEach(doc => {
        if (!doc.id.startsWith("day_")) return;
        const d = doc.data();
        if (!d.transects || d.transects.length === 0) return;
        dayCount++;
        d.transects.forEach(t => {
          totalTransects++;
          t.items.forEach(i => {
            totalItems++;
            if (i.mat === "plastic") totalPlastic++;
          });
          Object.entries(t.tallies||{}).forEach(([k,v]) => { tallies[k]=(tallies[k]||0)+v; });
        });
      });
      setAggStats({ totalItems, totalTransects, totalPlastic, dayCount, tallies });
      addLog("📊 Агрегат: " + dayCount + " днів, " + totalItems + " предм.");
    } catch(e) {
      addLog("⚠ Aggregate: " + (e.code||e.message||""));
    }
  },[]);

  // ── PERSIST (transect changes within current day) ──
  const setTs = (newTs) => {
    setTransects(newTs);
    saveDay(date, weather, newTs);
  };

  // ── CHANGE WEATHER (same day) ──
  const setWx = (wx) => {
    setWeather(wx);
    saveDay(date, wx, transects);
  };

  // ── CHANGE DATE → save current, load new ──
  const switchDate = async (newDate) => {
    // Save current day first
    if (transects.length > 0 || weather) {
      await saveDay(date, weather, transects);
    }
    // Load new day
    addLog("📅 → " + newDate);
    const dayData = await loadDay(newDate);
    setDate(newDate);
    setWeather(dayData.weather);
    setTransects(dayData.transects);
    setTId(null);
    if (dayData.transects.length > 0) {
      addLog("✅ " + newDate + " (" + dayData.transects.length + " тр.)");
    } else {
      addLog("📄 " + newDate + " — порожній");
    }
  };

  // ── REMEMBER (save to settings) ──
  const setRem = (rem) => { setRemembered(rem); saveSettings(rem, customMaterials); };
  const updateCustom = (custom) => { setCustomMaterials(custom); saveSettings(remembered, custom); };

  const tryAddCustom = () => {
    const v = newMat.trim();
    if (!v) return;
    if (v.includes("|")) { showToast("⚠ Без \"|\""); return; }
    if (MATERIALS.some(m=>m.id===v||m.label===v)) { showToast("⚠ Базовий"); return; }
    if (customMaterials.includes(v)) { showToast("⚠ Дубль"); return; }
    updateCustom([v, ...customMaterials]);
    setNewMat("");
    showToast("✓ Додано");
  };

  const delCustomMat = (label) => {
    const tagged = transects.flatMap(t=>t.items).filter(i=>i.mat===label).length;
    const doDelete = () => {
      if (mat===label) setMat(null);
      if (remembered.mat===label) setRem({...remembered, mat:null});
      updateCustom(customMaterials.filter(m=>m!==label));
      showToast("🗑 Видалено");
    };
    if (tagged > 0) askConfirm(`Видалити "${label}"? ${tagged} предметів збережуть назву.`, doDelete);
    else doDelete();
  };

  // ── DERIVED ──
  const zone     = ZONES.find(z=>z.id===zoneId);
  const zoneTs   = transects.filter(t=>t.zoneId===zoneId);
  const activeT  = transects.find(t=>t.id===tId);

  // Materials: custom (top) + base; orphans (deleted but still tagged) appended for lookup only
  const selectableMaterials = [
    ...customMaterials.map(l=>({id:l,label:l,e:"🏷"})),
    ...MATERIALS,
  ];
  const orphanMatIds = (() => {
    const known = new Set(selectableMaterials.map(m=>m.id));
    const seen = new Set();
    transects.forEach(t=>t.items.forEach(i=>{ if(!known.has(i.mat)) seen.add(i.mat); }));
    return [...seen];
  })();
  const allMaterials = [...selectableMaterials, ...orphanMatIds.map(id=>({id,label:id,e:"🏷"}))];
  const findMat = (id) => allMaterials.find(m=>m.id===id) || {id,label:id,e:"🏷"};

  const curKey   = mat&&src&&siz ? mkKey(mat,src,siz) : null;
  const curCount = curKey ? (activeT?.tallies[curKey]||0) : 0;
  const canTally = !!(mat&&src&&siz&&activeT);

  const formTotal   = activeT ? activeT.items.length : 0;
  const formPlastic = activeT ? activeT.items.filter(i=>i.mat==="plastic").length : 0;

  const allItems   = transects.flatMap(t=>t.items);
  const dayTotal   = allItems.length;
  const dayPlastic = allItems.filter(i=>i.mat==="plastic").length;

  const allTallies = transects.reduce((acc,t)=>{
    Object.entries(t.tallies).forEach(([k,v])=>{acc[k]=(acc[k]||0)+v;});
    return acc;
  },{});
  const dayMat = matStats(allTallies, allMaterials);

  // ── TALLY ACTIONS ──
  const addOne = () => {
    if (!canTally) return;
    const newItem = {
      id: Date.now(),
      mat, src, siz,
      n: (activeT.items.length)+1,
      comment: (commentRef.current || "").trim(),
    };
    setTs(transects.map(t => t.id!==tId ? t : {
      ...t,
      timeEnd: nowTime(),
      tallies: {...t.tallies, [curKey]:(t.tallies[curKey]||0)+1},
      items:   [...t.items, newItem],
    }));
    setComment(""); commentRef.current = "";
    const ml = findMat(mat).label;
    const sl = SIZES.find(s=>s.id===siz)?.label;
    showToast(`+1 · ${ml} / ${sl}`);
  };

  const removeOne = () => {
    if (!canTally||curCount===0) return;
    const items  = [...activeT.items];
    const lastIdx = items.map(i=>mkKey(i.mat,i.src,i.siz)).lastIndexOf(curKey);
    if (lastIdx===-1) return;
    items.splice(lastIdx,1);
    const renumbered = items.map((it,i)=>({...it,n:i+1}));
    const newTallies = {...activeT.tallies,[curKey]:activeT.tallies[curKey]-1};
    if (newTallies[curKey]===0) delete newTallies[curKey];
    setTs(transects.map(t=>t.id!==tId?t:{...t,tallies:newTallies,items:renumbered}));
  };

  const handleMatSelect = (id) => {
    setMat(id);
    if (remMat) setRem({...remembered, mat:id});
  };
  const handleSrcSelect = (id) => {
    setSrc(id);
    if (remSrc) setRem({...remembered, src:id});
  };
  const handleSizSelect = (id) => {
    setSiz(id);
    if (remSiz) setRem({...remembered, siz:id});
  };

  const handleRem = (field,val,checked) => {
    const rem={...remembered,[field]:checked?val:null};
    setRem(rem);
  };

  // ── TRANSECT ACTIONS ──
  const newTransect = () => {
    const L = +newLen||50, W = +newWid||5;
    if (L<=0 || W<=0) { showToast("⚠ Розмір > 0"); return; }
    const closed = transects.map(t=>t.zoneId===zoneId&&t.open?{...t,open:false}:t);
    const num = zoneTs.length+1;
    const t0 = nowTime();
    const nt = { id:Date.now(), zoneId, num, timeStart:t0, timeEnd:t0,
      length:L, width:W, area:L*W, note:"", open:true, tallies:{}, items:[] };
    const newTs = [...closed, nt];
    setTs(newTs);
    setTId(nt.id);
    setDetailTab("tally");
    setTab("tally");
  };

  const openTransect = (t) => { setTId(t.id); setDetailTab("tally"); setTab("tally"); };

  const closeTransect = () => {
    if (tId) setTs(transects.map(t=>t.id===tId?{...t,open:false}:t));
    setTId(null); setTab("zone");
  };

  const deleteTransect = (id) => {
    const t = transects.find(tr=>tr.id===id);
    const cnt = t ? t.items.length : 0;
    if (cnt > 0) {
      askConfirm(`Видалити трансект №${t.num} (${cnt} предметів)?`, () => {
        setTs(transects.filter(tr=>tr.id!==id));
        if (tId===id) { setTId(null); setTab("zone"); }
        showToast("🗑 Видалено");
      });
    } else {
      setTs(transects.filter(tr=>tr.id!==id));
      if (tId===id) { setTId(null); setTab("zone"); }
      showToast("🗑 Видалено");
    }
  };

  const updateNote = note => setTs(transects.map(t=>t.id!==tId?t:{...t,note}));
  const toggleExp  = id   => setExpanded(e=>({...e,[id]:!e[id]}));

  // ── STATS PER TRANSECT ──
  const transectStats = (t) => {
    const byKey = {};
    t.items.forEach(i=>{
      const k=mkKey(i.mat,i.src,i.siz);
      byKey[k]=(byKey[k]||0)+1;
    });
    return Object.entries(byKey).map(([k,n])=>{
      const [mId,sId,szId]=k.split("|");
      return {
        key:k, n,
        mat: findMat(mId),
        src: SOURCES.find(s=>s.id===sId),
        siz: SIZES.find(s=>s.id===szId),
        conc: (n/tArea(t)).toFixed(4),
      };
    }).sort((a,b)=>b.n-a.n);
  };

  // ── DAY STATS ──
  const transectCount = transects.length;
  const totalArea = transects.reduce((s,t)=>s+tArea(t),0);
  const avgConc = totalArea>0 ? (dayTotal/totalArea).toFixed(4) : "—";

  const typeConcs = (() => {
    return Object.entries(allTallies).map(([k,total])=>{
      const [mId,sId,szId]=k.split("|");
      return {
        key:k, total,
        mat: findMat(mId),
        src: SOURCES.find(s=>s.id===sId),
        siz: SIZES.find(s=>s.id===szId),
        avgConc: totalArea>0?(total/totalArea).toFixed(4):"—",
      };
    }).sort((a,b)=>b.total-a.total);
  })();

  // ── TSV EXPORT (tabs = works on mobile Sheets) ──
  const exportTSV = () => {
    const T = "\t";
    const clean = s => String(s||"").replace(/\t/g," ").replace(/\n/g," ");
    const h1 = ["Дата","Зона","Трансект_№","ЧасПочаток–ЧасКінець","Площа_м2","№","Матеріал","Джерело","Розмір","Примітка"].join(T);
    const rows1 = transects.flatMap(t=>{
      const zn = ZONES.find(z=>z.id===t.zoneId)?.name||t.zoneId;
      const trange = `${tStart(t)}–${tEnd(t)}`;
      const ar = tArea(t);
      const lines = [];
      // Transect note as a separate row (if exists)
      if (t.note && t.note.trim()) {
        lines.push([date,clean(zn),t.num,trange,ar,"","[ТРАНСЕКТ]","","","Примітка: "+clean(t.note)].join(T));
      }
      // Item rows — each with its own comment as "Примітка"
      t.items.forEach(i=>{
        const ml = findMat(i.mat).label;
        const sl = SOURCES.find(s=>s.id===i.src)?.label||i.src;
        lines.push([date,clean(zn),t.num,trange,ar,i.n,ml,sl,i.siz,clean(i.comment)].join(T));
      });
      return lines;
    });
    const h2 = "\n" + "СТАТИСТИКА КОНЦЕНТРАЦІЇ (пред./м², загальна площа " + totalArea + " м²)";
    const h3 = ["Матеріал","Джерело","Розмір","Всього","Сер.конц."].join(T);
    const rows2 = typeConcs.map(tc=>
      [tc.mat?.label||"—",tc.src?.label||"—",tc.siz?.label||"—",tc.total,tc.avgConc].join(T)
    );
    const tsv = [h1,...rows1,h2,h3,...rows2].join("\n");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(tsv).then(()=>showToast("📊 Скопійовано!")).catch(()=>showToast("⚠ Помилка копіювання"));
    } else {
      showToast("⚠ Буфер недоступний");
    }
  };

  const resetAll = () => {
    askConfirm("Скинути всі дані за день?", () => {
      setTs([]); setTId(null); setTab("zones");
      showToast("🔄 Скинуто");
    });
  };

  if (!loaded) return <><style>{G}</style><div className="loading">Завантаження...</div></>;

  return (
    <>
      <style>{G}</style>
      <div className="app">

        {/* TOPBAR */}
        <div className="top">
          {(tab==="zone"||tab==="tally")&&(
            <button className="top-back" onClick={()=>{
              if (tab==="tally") setTab("zone");
              else { setZoneId(null); setTab("zones"); }
            }}>←</button>
          )}
          <div className="top-info">
            <div className="top-title">
              {tab==="zones" && "🌊 НЯЧАНГ · БЛАНК"}
              {tab==="zone"  && `${zoneId} · ${zone?.name}`}
              {tab==="tally" && `${zoneId} · Т№${activeT?.num}`}
              {tab==="day"   && "ДЕНЬ · СТАТ."}
              {tab==="export"&& "ЗВІТ · ЕКСПОРТ"}
            </div>
            <div className="top-sub">
              {tab==="zones" && `${date} · ${weather?WEATHER.find(w=>w.id===weather)?.label:"погода?"}`}
              {tab==="zone"  && `${zoneTs.length} трансект(ів)`}
              {tab==="tally" && `${formTotal} предм. · ${activeT?.open?"● відкр.":"закр."}`}
              {tab==="day"   && `${date} · ${transects.length} тр. · ${dayTotal} предм.`}
              {tab==="export"&& "CSV лог + конц."}
            </div>
          </div>
          {dayTotal>0&&["zones","day","export"].includes(tab)&&
            <div className="top-badge">{dayTotal}</div>}
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{cursor:"pointer",fontSize:18,lineHeight:1}} onClick={toggleTheme}>
              {theme==="dark"?"☀️":"🌙"}
            </div>
            <div style={{fontSize:11,fontFamily:"'Syne Mono',monospace",
              color:saveStatus==="error"?C.red:saveStatus==="saved"?C.acc:saveStatus==="local"?C.amber:C.muted}}>
              {saveStatus==="saving"?"⏳":saveStatus==="saved"?"☁️":saveStatus==="local"?"📱":saveStatus==="error"?"❌":""}
            </div>
          </div>
        </div>

        <div className="scroll">

          {/* ══ ZONES ══ */}
          {tab==="zones"&&(
            <div className="sec">
              <div className="lbl">Оберіть ділянку</div>
              <div className="zone-list">
                {ZONES.map(z=>{
                  const cnt  = transects.filter(t=>t.zoneId===z.id).flatMap(t=>t.items).length;
                  const hasO = transects.some(t=>t.zoneId===z.id&&t.open);
                  return (
                    <div key={z.id} className="zone-card"
                      onClick={()=>{setZoneId(z.id);setTab("zone")}}>
                      <div className="zc-id">{z.id}</div>
                      <div className="zc-info">
                        <div className="zc-name">{z.name}</div>
                        <div className="zc-type">{z.type}{hasO?" · ● open":""}</div>
                      </div>
                      {cnt>0&&<div className="zc-count">{cnt}</div>}
                      <div className="zc-arr">›</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ══ ZONE ══ */}
          {tab==="zone"&&zone&&(
            <div className="sec">
              <div className="lbl">{zoneTs.length} трансект(ів)</div>
              {zoneTs.length===0&&<div className="empty">Немає трансектів.<br/>Натисни «+ Новий» нижче.</div>}
              <div className="tlist">
                {zoneTs.map(t=>{
                  const tot  = t.items.length;
                  const isEx = expanded[t.id];
                  const sts  = transectStats(t);
                  return (
                    <div key={t.id} className={`tcard${t.open?" active":""}`}>
                      <div className="tc-head">
                        <div className="tc-num">#{t.num}</div>
                        <div className="tc-info">
                          <div className="tc-title">Т№{t.num} · {tStart(t)}–{tEnd(t)}</div>
                          <div className="tc-sub">{tot} предм. · {tArea(t)}м² · {sts.length} комб.</div>
                        </div>
                        <div className="tc-right">
                          <div className="tc-total">{tot}</div>
                          <span className={`tc-status ${t.open?"open":"closed"}`}>
                            {t.open?"OPEN":"DONE"}
                          </span>
                        </div>
                      </div>
                      {t.note&&<div className="tc-note">"{t.note}"</div>}
                      <div className="tc-actions">
                        <button className="tc-btn" onClick={()=>toggleExp(t.id)}>
                          {isEx?"▲":"▼ Деталі"}
                        </button>
                        <button className="tc-btn acc" onClick={()=>openTransect(t)}>
                          {t.open?"▶ Далі":"↩ Відкр."}
                        </button>
                        <button className="tc-btn danger" onClick={()=>deleteTransect(t.id)}>🗑</button>
                      </div>
                      {isEx&&tot>0&&(
                        <div className="td-section">
                          <div className="lbl" style={{marginBottom:6}}>Зведена таблиця</div>
                          <table className="dtbl">
                            <thead>
                              <tr>
                                <th>Матеріал</th>
                                <th>Кл.</th>
                                <th style={{textAlign:"right"}}>N</th>
                                <th style={{textAlign:"right"}}>конц.</th>
                              </tr>
                            </thead>
                            <tbody>
                              {sts.map(s=>(
                                <tr key={s.key}>
                                  <td>
                                    <div className="d-mat">{s.mat?.e} {s.mat?.label}</div>
                                    <div className="d-src">{s.src?.label}</div>
                                  </td>
                                  <td><span className="d-sz">{s.siz?.label}</span></td>
                                  <td className="d-n">{s.n}</td>
                                  <td className="d-conc">{s.conc}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",gap:8,marginTop:14}}>
                <div style={{flex:1}}>
                  <div className="lbl" style={{marginBottom:6}}>Довжина, м</div>
                  <input className="inp" type="number" min="1" inputMode="numeric"
                    value={newLen} onChange={e=>setNewLen(e.target.value)}/>
                </div>
                <div style={{flex:1}}>
                  <div className="lbl" style={{marginBottom:6}}>Ширина, м</div>
                  <input className="inp" type="number" min="1" inputMode="numeric"
                    value={newWid} onChange={e=>setNewWid(e.target.value)}/>
                </div>
              </div>
              <button className="btn-new" onClick={newTransect} style={{marginTop:10}}>
                + Новий трансект ({(+newLen||0)}×{(+newWid||0)} = {(+newLen||0)*(+newWid||0)} м²)
              </button>
            </div>
          )}

          {/* ══ TALLY ══ */}
          {tab==="tally"&&activeT&&(
            <>
              <div style={{display:"flex",background:C.s1,borderBottom:`1px solid ${C.border}`}}>
                {[["tally","РАХУНОК"],["log","ЛОГ"],["stats","СТАТ."]].map(([id,label])=>(
                  <div key={id}
                    style={{flex:1,padding:"14px 4px",textAlign:"center",cursor:"pointer",
                      fontFamily:"'Syne Mono',monospace",fontSize:13,fontWeight:700,
                      letterSpacing:".1em",color:detailTab===id?C.acc:C.muted,
                      borderBottom:`3px solid ${detailTab===id?C.acc:"transparent"}`,
                      transition:"all .15s"}}
                    onClick={()=>setDetailTab(id)}>
                    {label}
                    {id==="log"&&formTotal>0&&
                      <span style={{marginLeft:6,background:C.acc,color:"#000",
                        fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:10}}>
                        {formTotal}
                      </span>}
                  </div>
                ))}
              </div>

              {detailTab==="tally"&&<>
                <div className="sec">
                  <div className="lbl">Примітка</div>
                  <textarea className="inp" rows={2}
                    placeholder="Стан берега, прилив..."
                    value={activeT.note} onChange={e=>updateNote(e.target.value)}/>
                </div>

                <div className="sec">
                  <div className="step-hdr">
                    <div className={`step-n${mat?"":" off"}`}>1</div>
                    <div className="step-title">Матеріал</div>
                    {mat&&<div className="step-sel">{findMat(mat).label}</div>}
                  </div>
                  <div className="chips">
                    {selectableMaterials.map(m=>(
                      <div key={m.id} className={`chip${mat===m.id?" on":""}`}
                        onClick={()=>handleMatSelect(m.id)}>{m.e} {m.label}</div>
                    ))}
                  </div>
                  <div className="rem-row" onClick={()=>handleRem("mat",mat,!remMat)}>
                    <div className={`rem-check${remMat?" on":""}`}>{remMat?"✓":""}</div>
                    <div className="rem-label">Запам'ятати</div>
                  </div>
                </div>

                <div className="sec">
                  <div className="step-hdr">
                    <div className={`step-n${src?"":" off"}`}>2</div>
                    <div className="step-title">Джерело</div>
                    {src&&<div className="step-sel">{SOURCES.find(s=>s.id===src)?.label}</div>}
                  </div>
                  <div className="chips">
                    {SOURCES.map(s=>(
                      <div key={s.id} className={`chip${src===s.id?" on":""}`}
                        onClick={()=>handleSrcSelect(s.id)}>{s.label}</div>
                    ))}
                  </div>
                  <div className="rem-row" onClick={()=>handleRem("src",src,!remSrc)}>
                    <div className={`rem-check${remSrc?" on":""}`}>{remSrc?"✓":""}</div>
                    <div className="rem-label">Запам'ятати</div>
                  </div>
                </div>

                <div className="sec">
                  <div className="step-hdr">
                    <div className={`step-n${siz?"":" off"}`}>3</div>
                    <div className="step-title">Розмір</div>
                    <span style={{fontSize:12,color:C.muted,fontFamily:"'Syne Mono',monospace",marginLeft:"auto"}}>
                      NOAA 2013
                    </span>
                  </div>
                  <div className="szrow">
                    {SIZES.map(sz=>(
                      <div key={sz.id} className={`szbtn${siz===sz.id?" on":""}`}
                        onClick={()=>handleSizSelect(sz.id)}>
                        <div className="sz-l">{sz.label}</div>
                        <div className="sz-d">{sz.desc}</div>
                      </div>
                    ))}
                  </div>
                  <div className="rem-row" onClick={()=>handleRem("siz",siz,!remSiz)}>
                    <div className={`rem-check${remSiz?" on":""}`}>{remSiz?"✓":""}</div>
                    <div className="rem-label">Запам'ятати</div>
                  </div>
                </div>

                <div className="tally-box" style={{marginTop:4}}>
                  {canTally&&(
                    <div className="tally-top">
                      <div className="tally-desc">
                        <div className="tally-combo">
                          {findMat(mat).e} {findMat(mat).label} · {SOURCES.find(s=>s.id===src)?.label}
                        </div>
                        <div className="tally-sub">Клас {siz} ({SIZES.find(s=>s.id===siz)?.desc})</div>
                      </div>
                      <div className="tally-num">{curCount}</div>
                    </div>
                  )}
                  <input
                    className="inp"
                    placeholder="Коментар: пляшка, кришка..."
                    value={comment}
                    onChange={e=>{setComment(e.target.value);commentRef.current=e.target.value;}}
                    style={{marginBottom:12}}
                  />
                  <button className="btn-plus" onClick={addOne} disabled={!canTally}>
                    {canTally?"+1":"Обери 1 · 2 · 3"}
                  </button>
                  <button className="btn-minus" onClick={removeOne} disabled={!canTally||curCount===0}>
                    −1 (скасувати)
                  </button>
                </div>

                <div className="sec" style={{marginTop:14}}>
                  <div className="lbl">Трансект</div>
                  <div className="mstats">
                    <div className="mstat"><div className="mstat-n">{formTotal}</div><div className="mstat-l">Всього</div></div>
                    <div className="mstat"><div className="mstat-n">{formPlastic}</div><div className="mstat-l">Пластик</div></div>
                    <div className="mstat">
                      <div className="mstat-n">{formTotal>0?Math.round(formPlastic/formTotal*100):0}%</div>
                      <div className="mstat-l">Пласт.%</div>
                    </div>
                  </div>
                </div>

                <div className="sec">
                  <button className="btn-save" onClick={closeTransect}>✓ Закрити трансект</button>
                </div>
              </>}

              {detailTab==="log"&&(
                <div className="sec">
                  <div className="lbl">{formTotal} предметів</div>
                  {formTotal===0
                    ? <div className="empty">Ще немає записів.<br/>РАХУНОК → +1</div>
                    : (
                      <div className="ilog">
                        {groupItems([...activeT.items].reverse()).map((g, gIdx)=>{
                          const isFirst = gIdx===0;
                          const ml = findMat(g.mat);
                          const sl = SOURCES.find(s=>s.id===g.src);
                          const isGroup = g.count > 1;
                          return (
                            <div key={`${g.key}-${g.firstN}-${g.comment}`}
                              className={`irow-item${isFirst?" last":""}${isGroup?" group":""}`}>
                              <div className="i-num">
                                {isGroup
                                  ? <span>#{g.items[g.items.length-1].n}–{g.items[0].n}</span>
                                  : <span>#{g.items[0].n}</span>
                                }
                              </div>
                              <div className="i-info">
                                <div className="i-main">
                                  {ml?.e} {ml?.label} · {sl?.label}
                                  {isGroup && <span className="i-badge">×{g.count}</span>}
                                </div>
                                {g.comment && (
                                  <div className="i-comment">💬 {g.comment}</div>
                                )}
                              </div>
                              <span className="i-sz">{g.siz}</span>
                            </div>
                          );
                        })}
                      </div>
                    )
                  }
                </div>
              )}

              {detailTab==="stats"&&(
                <div className="sec">
                  <div className="lbl">Концентрація (пред./{tArea(activeT)}м²)</div>
                  {formTotal===0
                    ? <div className="empty">Додай предмети</div>
                    : (
                      <table className="dtbl">
                        <thead>
                          <tr>
                            <th>Матеріал</th>
                            <th>Кл.</th>
                            <th style={{textAlign:"right"}}>N</th>
                            <th style={{textAlign:"right"}}>конц.</th>
                          </tr>
                        </thead>
                        <tbody>
                          {transectStats(activeT).map(s=>(
                            <tr key={s.key}>
                              <td>
                                <div className="d-mat">{s.mat?.e} {s.mat?.label}</div>
                                <div className="d-src">{s.src?.label}</div>
                              </td>
                              <td><span className="d-sz">{s.siz?.label}</span></td>
                              <td className="d-n">{s.n}</td>
                              <td className="d-conc">{s.conc}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )
                  }
                  <div style={{marginTop:14,padding:12,background:C.s3,borderRadius:10,
                    fontFamily:"'Syne Mono',monospace",fontSize:12,color:C.muted,lineHeight:1.8}}>
                    конц. = N / {tArea(activeT)} м² ({activeT.length||50}×{activeT.width||5} м)
                  </div>
                </div>
              )}
            </>
          )}

          {/* ══ DAY ══ */}
          {tab==="day"&&<>
            <div className="sec">
              <div className="lbl">Дата</div>
              <input className="inp" type="date" value={date}
                onChange={e=>switchDate(e.target.value)}
                style={{marginBottom:12}}/>
              <div className="lbl">Погода</div>
              <div className="wx-row">
                {WEATHER.map(w=>(
                  <div key={w.id} style={{textAlign:"center"}}>
                    <div className={`wx-btn${weather===w.id?" on":""}`}
                      onClick={()=>setWx(w.id)}>{w.e}</div>
                    <div className="wx-lbl">{w.label}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="sec">
              <div className="lbl">📅 {date}</div>
              <div className="day-stats">
                <div className="dstat"><div className="dstat-n">{transects.length}</div><div className="dstat-l">Трансектів</div></div>
                <div className="dstat"><div className="dstat-n">{dayTotal}</div><div className="dstat-l">Предметів</div></div>
                <div className="dstat blue"><div className="dstat-n">{dayPlastic}</div><div className="dstat-l">Пластику</div></div>
                <div className="dstat amber">
                  <div className="dstat-n">{dayTotal>0?Math.round(dayPlastic/dayTotal*100):0}%</div>
                  <div className="dstat-l">Пласт. %</div>
                </div>
              </div>
            </div>
            {transectCount>0&&(
              <div className="sec">
                <div className="lbl">Концентрація · {date}</div>
                <div style={{background:C.s2,border:`1px solid ${C.border}`,borderRadius:12,
                  padding:16,fontFamily:"'Syne Mono',monospace",fontSize:14,color:C.text,
                  display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:C.muted,fontSize:12}}>пред./м² · S={totalArea}м²</span>
                  <span style={{color:C.acc,fontSize:26,fontWeight:700}}>{avgConc}</span>
                </div>
                <div className="lbl" style={{marginTop:16}}>Топ типів</div>
                <table className="dtbl">
                  <thead>
                    <tr>
                      <th>Матеріал</th>
                      <th>Кл.</th>
                      <th style={{textAlign:"right"}}>N</th>
                      <th style={{textAlign:"right"}}>Конц.</th>
                    </tr>
                  </thead>
                  <tbody>
                    {typeConcs.slice(0,10).map(tc=>(
                      <tr key={tc.key}>
                        <td>
                          <div className="d-mat">{tc.mat?.e} {tc.mat?.label}</div>
                          <div className="d-src">{tc.src?.label}</div>
                        </td>
                        <td><span className="d-sz">{tc.siz?.label}</span></td>
                        <td className="d-n">{tc.total}</td>
                        <td className="d-conc">{tc.avgConc}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {dayMat.length>0&&(
              <div className="sec">
                <div className="lbl">Структура матеріалів</div>
                {dayMat.map(m=>(
                  <div key={m.id} className="bar-row">
                    <div className="bar-lbl">{m.e} {m.label}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width:`${Math.round(m.count/dayTotal*100)}%`}}/>
                    </div>
                    <div className="bar-val">{m.count}</div>
                  </div>
                ))}
              </div>
            )}
            {/* AGGREGATE BANNER */}
            <div className="sec">
              <div className="lbl">📊 Весь період дослідження</div>
              {aggStats ? (
                <div className="day-stats">
                  <div className="dstat"><div className="dstat-n">{aggStats.dayCount}</div><div className="dstat-l">Днів</div></div>
                  <div className="dstat"><div className="dstat-n">{aggStats.totalTransects}</div><div className="dstat-l">Трансектів</div></div>
                  <div className="dstat"><div className="dstat-n">{aggStats.totalItems}</div><div className="dstat-l">Предметів</div></div>
                  <div className="dstat amber">
                    <div className="dstat-n">{aggStats.totalItems>0?Math.round(aggStats.totalPlastic/aggStats.totalItems*100):0}%</div>
                    <div className="dstat-l">Пластик</div>
                  </div>
                </div>
              ) : (
                <button className="btn-new" onClick={loadAggregate} style={{marginTop:0}}>
                  Завантажити статистику
                </button>
              )}
            </div>
          </>}

          {/* ══ EXPORT ══ */}
          {tab==="export"&&(
            <div className="sec">
              <div className="lbl">Експорт</div>
              <div style={{background:C.s2,border:`1px solid ${C.border}`,borderRadius:12,
                padding:16,marginBottom:16,fontFamily:"'Syne Mono',monospace",
                fontSize:14,color:C.muted,lineHeight:2}}>
                Дата: {date}<br/>
                Трансектів: <span style={{color:C.acc,fontWeight:700}}>{transects.length}</span><br/>
                Предметів: <span style={{color:C.acc,fontWeight:700}}>{dayTotal}</span><br/>
                Типів: <span style={{color:C.acc,fontWeight:700}}>{typeConcs.length}</span>
              </div>
              <button className="btn-export" onClick={exportTSV} disabled={transects.length===0}>
                📊 Скопіювати дані
              </button>
              <div className="note-text">
                Sheets → A1 → Вставити (довгий тап)<br/>
                Кожен предмет = окремий рядок + примітка<br/>
                Примітка трансекта — окремим рядком
              </div>
              <div style={{marginTop:18,paddingTop:18,borderTop:`1px solid ${C.border}`}}>
                <div className="lbl">Матеріали</div>
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  <input className="inp" placeholder="Нова назва..." value={newMat}
                    onChange={e=>setNewMat(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter") tryAddCustom();}}/>
                  <button onClick={tryAddCustom} style={{background:C.acc,color:"#000",border:"none",
                    borderRadius:10,padding:"0 20px",fontSize:24,fontWeight:700,cursor:"pointer",
                    fontFamily:"'Syne Mono',monospace"}}>+</button>
                </div>
                {customMaterials.length>0 ? (
                  <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
                    {customMaterials.map(l=>(
                      <div key={l} style={{display:"flex",alignItems:"center",gap:10,
                        padding:"10px 14px",background:C.s2,border:`1px solid ${C.border}`,borderRadius:10}}>
                        <span style={{flex:1,color:C.text,fontSize:15}}>🏷 {l}</span>
                        <button onClick={()=>delCustomMat(l)} style={{background:"none",border:"none",
                          color:C.red,fontSize:24,cursor:"pointer",padding:"0 8px",lineHeight:1}}>×</button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{fontSize:13,color:C.muted,fontFamily:"'Syne Mono',monospace",
                    marginBottom:10,fontStyle:"italic"}}>Немає кастомних</div>
                )}
                <div style={{fontSize:11,color:C.muted,fontFamily:"'Syne Mono',monospace",
                  lineHeight:1.7,padding:"10px 12px",background:C.s3,borderRadius:8}}>
                  Базові (незмінні): {MATERIALS.map(m=>m.e+" "+m.label).join(" · ")}
                </div>
              </div>
              <button className="btn-danger" onClick={resetAll} style={{marginTop:18}}>🔄 Скинути весь день</button>
              <div className="note-text" style={{marginTop:12}}>
                {saveStatus==="saved"?"☁️ Дані в Firebase":""}
                {saveStatus==="error"?"❌ Помилка Firebase!":""}
                {saveStatus==="saving"?"⏳ Зберігаю...":""}
                {saveStatus===""?"🆕 Новий сеанс":""}
                {saveStatus==="local"?"📱 Локально (офлайн)":""}
              </div>
              {/* DIAGNOSTIC LOG */}
              <div style={{marginTop:16,padding:12,background:C.s3,borderRadius:10,
                fontFamily:"'Syne Mono',monospace",fontSize:12,color:C.muted,lineHeight:2}}>
                <div style={{color:C.text,fontWeight:700,marginBottom:4}}>🔧 ДІАГНОСТИКА</div>
                {dbLog.map((l,i) => <div key={i}>{l}</div>)}
                {dbLog.length===0 && <div>Порожньо...</div>}
              </div>
            </div>
          )}

        </div>

        {/* BNAV */}
        {tab!=="tally"&&(
          <div className="bnav">
            {[["zones","🗺","ЗОНИ"],["day","📊","ДЕНЬ"],["export","📤","ЗВІТ"]].map(([id,icon,label])=>(
              <div key={id} className={`bn-item${tab===id?" on":""}`} onClick={()=>setTab(id)}>
                <div className="bn-icon">{icon}</div>
                <div className="bn-label">{label}</div>
                <div className="bn-dot"/>
              </div>
            ))}
          </div>
        )}

      </div>
      {toast&&<div className="toast">{toast}</div>}

      {confirmDialog&&(
        <div className="confirm-overlay" onClick={()=>setConfirmDialog(null)}>
          <div className="confirm-box" onClick={e=>e.stopPropagation()}>
            <div className="confirm-msg">{confirmDialog.msg}</div>
            <div className="confirm-btns">
              <button className="confirm-cancel" onClick={()=>setConfirmDialog(null)}>Ні</button>
              <button className="confirm-ok" onClick={()=>{confirmDialog.onOk();setConfirmDialog(null);}}>Так</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}


window._APP_OK = true;
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
